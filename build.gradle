plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.logging.console.level', 'debug'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
    runtimeClasspath.extendsFrom compileClasspath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                 minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-URL'      : 'https://github.com/H2Sxxa/TouhouTweaks',
            'Attribution'             : 'Original author H2Sxxa - https://github.com/H2Sxxa/TouhouTweaks (GPL-3.0-only)',
            'License'                 : 'GPL-3.0-only'
        ])
    }
    from('../LICENSE') { into 'META-INF'; rename { 'LICENSE.txt' } }
    from('NOTICE.md') { into 'META-INF'; rename { 'NOTICE.md' } }
}
